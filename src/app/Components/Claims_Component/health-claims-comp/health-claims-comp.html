<!-- ==================== HEALTH CLAIMS HERO ==================== -->
<section class="health-claim-hero mt-4">

  <div class="health-claim-container">

    <!-- LEFT CONTENT -->
    <div class="hero-left">

      <p class="hero-small-title">Health insurance claim</p>

      <h1>
        We’re committed to providing a
        <br />
        <strong>worry-free</strong> claim
        <br />
        experience
      </h1>

      <!-- App Download -->
      <div class="app-download">

        <div class="app-title">
          <img
            src="/assets/health-insurance-icon/Tack_care_logo.svg"
            alt="IL TakeCare"
          />

          <span>
            Download the <strong>IL TakeCare</strong> App
          </span>
        </div>

        <div class="app-buttons">

          <a href="#" class="store-button">
            <img
              src="/assets/health-insurance-icon/Play_Store_logo.svg"
              alt="Get it on Google Play"
            />
          </a>

          <a href="#" class="store-button">
            <img
              src="/assets/health-insurance-icon/App_Store_logo.svg"
              alt="Download on the App Store"
            />
          </a>

        </div>

      </div>

    </div>


    <!-- HERO ILLUSTRATION -->
    <div class="hero-illustration">

      <img
        src="/assets/health-insurance-icon/health_comp_img.svg"
        alt="Health insurance claim"
      />

    </div>


    <!-- RIGHT CLAIM STATUS CARD -->
    <div class="claim-status-card">

      <h2>Check health claim status</h2>

      <div class="user-type">

        <p>Type of user</p>

        <label class="radio-option">
          <input
            type="radio"
            name="userType"
            value="retail"
            checked
          />
          <span class="custom-radio"></span>
          Retail User
        </label>

        <label class="radio-option">
          <input
            type="radio"
            name="userType"
            value="corporate"
          />
          <span class="custom-radio"></span>
          Corporate User
        </label>

      </div>


      <div class="claim-input">

        <input
          type="text"
          placeholder="Enter claim number"
        />

      </div>


      <button class="proceed-button">
        Proceed
      </button>

    </div>

  </div>

</section>
