

<div class="main-section">

    <div class="container-fluid">
        <div class="row align-items-center min-vh-100">

            <!-- LEFT SIDE -->
            <div class="col-lg-7 left-section">

                <h1>
                    Globettrotter – Overseas<br>
                    Individual Student<br>
                    Travel Insurance
                </h1>

                <p class="description">
                    Medical & trip-related coverage for worry-free studies abroad
                </p>

                <div class="benefits">

                    <div class="benefit">
                        <i class="bi bi-heart-pulse"></i>
                        <span>
                            Extensive health coverage including dental protection
                        </span>
                    </div>

                    <div class="benefit">
                        <i class="bi bi-mortarboard"></i>
                        <span>
                            Study interruption cover
                        </span>
                    </div>

                    <div class="benefit">
                        <i class="bi bi-person-badge"></i>
                        <span>
                            Personal accident cover
                        </span>
                    </div>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="col-lg-5">

                <div class="form-card">

                    <form id="travelForm">

                        <!-- Mobile -->
                        <div class="input-group-custom">
                            <label for="mobile">
                                Mobile number<span>*</span>
                            </label>

                            <input
                                type="tel"
                                id="mobile"
                                class="form-control-custom"
                                required
                            >
                        </div>


                        <!-- Email -->
                        <div class="input-group-custom">
                            <label for="email">
                                Email<span>*</span>
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control-custom"
                                required
                            >
                        </div>


                        <!-- Region -->
                        <div class="region-section">

                            <h5>Select region of travel</h5>

                            <div class="form-check radio-option">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="region"
                                    id="worldwide1"
                                    value="Worldwide excluding USA or Canada"
                                    checked
                                >

                                <label
                                    class="form-check-label"
                                    for="worldwide1"
                                >
                                    Worldwide excluding USA or Canada
                                </label>
                            </div>


                            <div class="form-check radio-option">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="region"
                                    id="worldwide2"
                                    value="Worldwide including USA or Canada"
                                >

                                <label
                                    class="form-check-label"
                                    for="worldwide2"
                                >
                                    Worldwide including USA or Canada
                                </label>
                            </div>

                        </div>


                        <!-- Terms -->
                        <div class="checkbox-section">

                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    required
                                    checked
                                >

                                <label
                                    class="form-check-label"
                                    for="terms"
                                >
                                    I agree to the
                                    <a href="#">terms and conditions</a>
                                </label>
                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="whatsapp"
                                    checked
                                >

                                <label
                                    class="form-check-label"
                                    for="whatsapp"
                                >
                                    I want to get updates on
                                    <i class="bi bi-whatsapp"></i>
                                    <strong>WhatsApp</strong>
                                </label>

                            </div>

                        </div>


                        <!-- Submit -->
                        <button
                            type="submit"
                            class="submit-btn"
                        >
                            Submit
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>
